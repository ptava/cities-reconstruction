name: Quality

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  quality:
    name: Python 3.11 quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          version: latest-known

      - name: Install locked development environment
        run: uv sync --locked --group dev

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run configured mypy
        run: uv run mypy

      - name: Run pytest with branch coverage
        run: uv run pytest -q --cov=cities_reconstruction --cov-branch --cov-report=term-missing
