[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cities-reconstruction"
version = "0.1.0"
description = "City geometry reconstruction pipeline scaffold for CFD-ready OpenFOAM domains."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "cities-reconstruction contributors" },
]
dependencies = [
    "shapely>=2.1.2",
]

[dependency-groups]
dev = [
  "cadquery>=2.7,<3",
  "mypy>=1.17",
  "pytest>=8.0",
  "pytest-cov>=6.2",
  "ruff>=0.12",
  "types-shapely>=2.1",
]

[project.scripts]
cities-reconstruction = "cities_reconstruction.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cities_reconstruction"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120
include = [
  "pyproject.toml",
  "src/cities_reconstruction/adapters/*.py",
  "src/cities_reconstruction/artifacts.py",
  "src/cities_reconstruction/cli.py",
  "src/cities_reconstruction/pipeline.py",
  "src/cities_reconstruction/pipeline_execution.py",
  "src/cities_reconstruction/stage_layout.py",
  "src/cities_reconstruction/stage_runtime.py",
  "src/cities_reconstruction/stage_contract.py",
  "src/cities_reconstruction/stage_result.py",
  "tests/test_cli.py",
  "tests/test_pipeline.py",
  "tests/test_pipeline_execution.py",
  "tests/test_stage_layout.py",
  "tests/test_stage_contract.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = [
  "src/cities_reconstruction/adapters/city4cfd.py",
  "src/cities_reconstruction/artifacts.py",
  "src/cities_reconstruction/cli.py",
  "src/cities_reconstruction/pipeline.py",
  "src/cities_reconstruction/pipeline_execution.py",
  "src/cities_reconstruction/stage_layout.py",
  "src/cities_reconstruction/stage_runtime.py",
  "src/cities_reconstruction/stage_contract.py",
  "src/cities_reconstruction/stage_result.py",
]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source = ["cities_reconstruction"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true
